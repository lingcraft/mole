[project]
name = "mole"
version = "1.13.11"
description = """
- 修复：修复3点前启动程序，在3点后运行一键获取拉姆变身值功能时会无法获取并且按钮一直灰色的问题
- 优化：增加异常信息的日志打印，方便排查功能问题
"""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6~=6.11.2",
    "cffi~=2.1.1",
    "nuitka~=4.2.1",
    "zstandard~=0.25",
    "packaging~=26.3",
    "py3amf~=0.9.1",
    "pypinyin~=0.55.0",
    "requests~=2.34.2",
    "loguru~=0.7.3",
]
