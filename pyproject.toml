[project]
name = "mole"
version = "1.13.8"
description = """
- 优化：餐厅卖菜若选中菜已卖完，则停止卖菜任务并更新餐台信息
- 优化：swf 资源请求采用分块流式转发和压缩，加快响应速度，并增加 swf 资源响应时间日志打印，方便排查哪些资源请求耗时过长
"""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6~=6.11.2",
    "cffi~=2.1.1",
    "nuitka~=4.2.1",
    "zstandard~=0.25",
    "packaging~=26.3",
    "py3amf~=0.9.1",
    "pypinyin~=0.55.0",
    "requests~=2.34.2",
    "loguru~=0.7.3",
]
