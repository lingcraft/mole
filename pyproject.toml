[project]
name = "mole"
version = "1.11.7"
description = """
- 修复：修复0点之前启动做菜任务，若0-6点间进过餐厅，则6点餐厅开启后的第1次做菜一直卡在做菜中的问题
- 新增：增加mole.log日志文件，记录日志
"""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cffi~=2.1.0",
    "loguru~=0.7.3",
    "nuitka~=4.1.3",
    "packaging~=26.2",
    "py3amf~=0.9.1",
    "pypinyin~=0.55.0",
    "pyside6~=6.11.1",
    "requests~=2.34.2",
    "zstandard~=0.25",
]
