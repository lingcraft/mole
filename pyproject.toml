[project]
name = "mole"
version = "1.12.8"
description = """
- 修复：官服个人信息面板的向导图标最高只显示“小蘑菇向导”的问题修复，ClientAppDLL.swf 中去掉 3 行代码实现
- 修复：官服元素骑士竞技场查看他人信息面板时竞技场排名恒为 0 的问题修复，ElementKnightUserInfoPanel.swf 中请求 9017 包的结果中增加设置竞技场排名信息
- 优化：标题状态机更新间隔调整为 100ms，避免之前的状态机在部分状态下标题更新间隔为 50ms 而其他状态下更新间隔为 1s 可能导致的状态最短显示时间异常问题
- 优化：写回原始数据方法优化
- 新增：每日礼包增加金鱼宝藏的金玉宫殿探险奖励内容
- 新增：新增化石自动鉴定功能
- 新增：新增元素骑士竞技场自动挑战功能
"""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cffi~=2.1.1",
    "loguru~=0.7.3",
    "nuitka~=4.1.3",
    "packaging~=26.3",
    "py3amf~=0.9.1",
    "pypinyin~=0.55.0",
    "pyside6~=6.11.1",
    "requests~=2.34.2",
    "zstandard~=0.25",
]
