[project]
name = "mole"
version = "1.13.10"
description = """
- 优化：swf/append 下的 xml 资源修改逻辑优化，只有商店商品信息 MoleShop.xml 是以官服为基底+平行服新增内容+自定义修改规则，其他 xml 资源只应用自定义修改规则
"""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6~=6.11.2",
    "cffi~=2.1.1",
    "nuitka~=4.2.1",
    "zstandard~=0.25",
    "packaging~=26.3",
    "py3amf~=0.9.1",
    "pypinyin~=0.55.0",
    "requests~=2.34.2",
    "loguru~=0.7.3",
]
