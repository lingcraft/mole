[project]
name = "mole"
version = "1.11.1"
description = """
- 新增：新增 80 项每日奖励一键领取功能，感谢江江大佬提供的封包数据
- 优化：每日奖励中的几个抽奖选项设为单选互斥组，并优化单选组和多选选项的全选和反选逻辑
- 优化：每日奖励领取时增加标题的进度展示，每项至少显示 0.1 秒
- 优化：send_lines() 方法增加 progress 回调函数参数，用于显示发送进度，同时对于 dict 类型数据处理进行优化，并进行了实际应用
- 优化：start_update_title() 方法增加 on_tick 参数，用于进度节流显示，不会跳动幅度过大，保证进度稳定增长，不被提前掐断
- 优化：tab 标签名称优化
"""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cffi~=2.1.0",
    "nuitka~=4.1.3",
    "packaging~=26.2",
    "py3amf~=0.9.1",
    "pypinyin~=0.55.0",
    "pyside6~=6.11.1",
    "requests~=2.34.2",
    "zstandard~=0.25",
]
