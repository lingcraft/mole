[project]
name = "mole"
version = "1.12.3"
description = """
- 优化：所有拉姆获取变身值完毕然后让主超拉跟随之后再喂养一次主超拉，因为让拉姆跟随也消耗四项值
- 优化：增加 swf 替换功能，swf/replace 目录下的 swf 匹配时会自动替换客户端请求的 swf
- 优化：增加 xml 追加功能，swf/append 目录下的 xml 匹配时会自动将其各个标签节点内容追加到客户端请求的原始 xml 中
- 优化：官服商店商品配置中，增加平行服商店中的商品和部分时报中的套装商品
- 优化：官服背包和商店替换为平行服的 swf 资源，让背包和商店支持搜索，感想江江大佬的贡献
"""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cffi~=2.1.0",
    "loguru~=0.7.3",
    "nuitka~=4.1.3",
    "packaging~=26.2",
    "py3amf~=0.9.1",
    "pypinyin~=0.55.0",
    "pyside6~=6.11.1",
    "requests~=2.34.2",
    "zstandard~=0.25",
]
