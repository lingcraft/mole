[project]
name = "mole"
version = "1.12.10"
description = """
- 新增：新增清除 Flash 缓存功能，只清除 swf、xml 缓存，记录的账号等配置不会清除
- 新增：ClientAppDLL.swf 中的每日在线奖励功能由打开 OnlineAwardPanel.swf 面板改为平行服的打开 NewGiftLoginPanel.swf 面板，可以领取更多奖励
- 优化：客户端的注入端口和命令桥端口单客户端默认 10000 和 10001，启动多个时后续端口才会自动分配，可能解决了每次启动端口不一样然后 swf 缓存不命中的问题
- 优化：bridge.py 命令桥代码连接相关供能增加异常处理（比如切换节点或者刷新时），让调试时控制台不会再报错，对实际使用无影响
- 优化：swf/replace 替换资源目录下，若是名字以 DLL.swf 结尾的资源文件，仅在官服替换，不替换平行服，防止平行服运行时核心 swf 被替换为官服资源
"""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cffi~=2.1.1",
    "loguru~=0.7.3",
    "nuitka~=4.1.3",
    "packaging~=26.3",
    "py3amf~=0.9.1",
    "pypinyin~=0.55.0",
    "pyside6~=6.11.1",
    "requests~=2.34.2",
    "zstandard~=0.25",
]
