[project]
name = "mole"
version = "1.11.5"
description = """
- 修复：修复魔灵一键升级的每个包间隔过短导致部分升级包发送失败，从而材料充足的情况下没有一键升到满级的问题，现在调整间隔为50ms
"""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cffi~=2.1.0",
    "nuitka~=4.1.3",
    "packaging~=26.2",
    "py3amf~=0.9.1",
    "pypinyin~=0.55.0",
    "pyside6~=6.11.1",
    "requests~=2.34.2",
    "zstandard~=0.25",
]
