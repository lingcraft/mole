[project]
name = "mole"
version = "1.12.1"
description = """
- 新增：新增全部拉姆的采集物品获取变身值的功能（之前只会让跟随自己的超级拉姆采集物品获取变身值）
- 优化：摩摩怪挑战完毕后再进入摩摩训练场，防止加载地图场景导致偶现的挑战异常问题
"""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cffi~=2.1.0",
    "loguru~=0.7.3",
    "nuitka~=4.1.3",
    "packaging~=26.2",
    "py3amf~=0.9.1",
    "pypinyin~=0.55.0",
    "pyside6~=6.11.1",
    "requests~=2.34.2",
    "zstandard~=0.25",
]
