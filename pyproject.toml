[project]
name = "mole"
version = "1.14.1"
description = """
- 修复：修复当官服登录页 Client.swf 请求失败时，会自动回退到平行服的资源导致卡在“请稍候，正在进入摩尔庄园...”的问题，登录页 Client.swf 加入失败回退平行服资源的黑名单
"""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6==6.12.0",
    "cffi==2.1.1",
    "nuitka==4.3",
    "zstandard==0.25",
    "packaging==26.3",
    "py3amf==0.9.1",
    "pypinyin==0.55.0",
    "requests==2.34.2",
    "loguru==0.7.3"
]
