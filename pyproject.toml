[project]
name = "mole"
version = "1.12.2"
description = """
- 修复：修复点击任意拉姆获取其信息后，全部拉姆字典信息被置为只有此拉姆信息的问题
- 修复：修复除了超拉之外的拉姆获取变身值失败的问题，其他拉姆获取变身值前先让其跟随
- 修复：修复除了超拉之外的拉姆学习最大变身技能失败的问题，同样让其先跟随
- 优化：拉姆学习完最大技能后，直接将其技能列表配置上最大技能，不需要再手动设置了
- 优化：所有拉姆获取完变身值后，重新让主超拉跟随自己
- 优化：拉姆获取变身值时，变身技能id和上次相同时，只发送采集物品包，不同时再发送变身包+采集物品包
"""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cffi~=2.1.0",
    "loguru~=0.7.3",
    "nuitka~=4.1.3",
    "packaging~=26.2",
    "py3amf~=0.9.1",
    "pypinyin~=0.55.0",
    "pyside6~=6.11.1",
    "requests~=2.34.2",
    "zstandard~=0.25",
]
