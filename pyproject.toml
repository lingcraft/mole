[project]
name = "mole"
version = "1.14.0"
description = """
- 新增：增加进程代理功能，原本端口都在 127.0.0.1:10000 上，无法命中官服的 mole.61.com 的账号登录信息和 Flash 缓存，现在所有请求都会显示官方的域名，直接命中官服账号信息和缓存数据
- 新增：平行服1个版本的不同节点也进行优化命中同1份缓存加快加载速度
- 新增：平行服家园道具搜索功能、小屋道具搜索功能、毛毛树批量浇水施肥功能移植到官服，并略微加快毛毛树批量浇水施肥功能速度
- 修复：官服替换资源后，毛毛树的浇水/施肥记录显示的摩尔名字和时间异常，修复 house.swf 中的此问题
- 优化：清理缓存现在只清理追加/替换的同名资源，并增加"【官服】"资源文件名前缀，代表只替换官服资源不替换平行服资源
- 优化：官服点开始后要等超时 5 秒的解决方案优化，原本为修改 Server.xml 的 MOUrl 数据，但会被本地缓存影响，并且要等待 100~200ms的接口请求，现在改为本地响应已死的官服的 http://login.mole.61.com/crossdomain.xml 跨域策略，秒加载
- 优化：单文件打包程序逻辑优化，原本程序数据会解压到 %temp%\\onefile_xxx 目录下，每次打开都要解压一次，更改为固定路径 %appdata%\\mole\\cache\\program\\版本号，首次启动解压过1次后，后面再打开都是秒开，同时打开时会清理旧版程序目录防止占用空间
"""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6~=6.12.0",
    "cffi~=2.1.1",
    "nuitka~=4.3",
    "zstandard~=0.25",
    "packaging~=26.3",
    "py3amf~=0.9.1",
    "pypinyin~=0.55.0",
    "requests~=2.34.2",
    "loguru~=0.7.3",
]
