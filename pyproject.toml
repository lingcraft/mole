[project]
name = "mole"
version = "1.13.15"
description = """
- 优化：增加进程代理功能，原本端口都在 127.0.0.1:10000 上，无法命中官服的 mole.61.com 的账号登录信息和 Flash 缓存，现在所有请求都会显示官方的域名，直接命中官服账号信息和缓存数据
- 优化：平行服一个版本的不同节点也进行优化命中同一份缓存加快加载速度
- 优化：bridge.py 代码细节优化
"""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6~=6.12.0",
    "cffi~=2.1.1",
    "nuitka~=4.3",
    "zstandard~=0.25",
    "packaging~=26.3",
    "py3amf~=0.9.1",
    "pypinyin~=0.55.0",
    "requests~=2.34.2",
    "loguru~=0.7.3",
]
