[project]
name = "mole"
version = "1.12.19"
description = """
- 优化：多实例注入端口和命令桥端口分配逻辑优化，当有多个实例时，端口会自动递增，原来的系统自动分配速度太慢了并且无法命中 Flash 缓存，现在多实例每个会保存自己的 swf 缓存，不会自动分配端口不固定而产生多余的可能只用1次的缓存，提升加载速度
- 修复：ElementKnightInfoPanel.swf 元素骑士信息面板修复在道具页时，点击卡牌升级或进阶进入选卡界面然后直接关闭/点击活动功能界面然后再切回去/点击排序界面，然后再点击任意1个无卡牌的卡牌页，会出现部分格子的道具数量文本显示残留的问题，是在 ElementCardPanel 的 itemInfo 方法中直接 this.addChild 扰乱了时间轴导致，现在改为用 this.mc.setChildIndex 将道具图标放到道具数量下面的方法，不扰乱时间轴从而不会道具文本残留
- 优化：卡罗拉幸运儿领奖查询只在官服进行，并且是幸运儿时领到的奖励进行提示，平行服不执行因为已经有了
- 优化：清理缓存功能改为后台线程执行，防止缓存过多时点击菜单会卡顿一下
"""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cffi~=2.1.1",
    "loguru~=0.7.3",
    "nuitka~=4.1.3",
    "packaging~=26.3",
    "py3amf~=0.9.1",
    "pypinyin~=0.55.0",
    "pyside6~=6.11.1",
    "requests~=2.34.2",
    "zstandard~=0.25",
]
