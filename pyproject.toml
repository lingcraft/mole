[project]
name = "mole"
version = "1.11.6"
description = """
- 新增：增加6项元素骑士相关的每日奖励
- 新增：增加process_data()方法，用于处理send_lines()中批量发送的数据，目前增加了407提交游戏分数包的处理，对包体的第3个4字节的游戏校验字段进行处理
"""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cffi~=2.1.0",
    "nuitka~=4.1.3",
    "packaging~=26.2",
    "py3amf~=0.9.1",
    "pypinyin~=0.55.0",
    "pyside6~=6.11.1",
    "requests~=2.34.2",
    "zstandard~=0.25",
]
