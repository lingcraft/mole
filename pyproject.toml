[project]
name = "mole"
version = "1.13.9"
description = """
- 优化：本地 swf 资源请求也采用分块流式转发和压缩，模仿官服资源请求过程，块大小设为 4KB，使 swf 加载进度更平滑
- 修复：修复元素骑士竞技场任务当账号掉线之后再执行失败时，重新启动任务倒计时会卡在 00:00 的问题
"""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6~=6.11.2",
    "cffi~=2.1.1",
    "nuitka~=4.2.1",
    "zstandard~=0.25",
    "packaging~=26.3",
    "py3amf~=0.9.1",
    "pypinyin~=0.55.0",
    "requests~=2.34.2",
    "loguru~=0.7.3",
]
