[project]
name = "mole"
version = "1.13.2"
description = """
- 新增：元素骑士竞技场挑战加入江江大佬的对手挑选算法，感谢其思路。初始运行时，先获取自己排名和刷新3轮推荐玩家数据，若自己排名在100以内则直接挑战固定很弱的玩家，若自己排名<=500或者有2/3的玩家攻防都高于自己，则采用排名优先策略，且相同排名收益选胜率最高的，尽量往前100名进然后可以任意挑战玩家；若自己排名>=2000或者有2/3的玩家攻防都低于自己，则采用胜率优先策略，若相同胜率则取属性最低的玩家挑战，且保持排名不动；否则其他情况则采用均衡策略，此时按最高的评分来（评分=排名收益×胜率），动态调整策略来确保能获得最多的声望
- 优化：每日奖励弹窗优化
- 修复：元素骑士竞技场修复启动时竞技场剩余次数为0但是天赋可领悟次数>0时，提前结束并提示“已完成元素骑士竞技场挑战和天赋领悟”的问题
"""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cffi~=2.1.1",
    "loguru~=0.7.3",
    "nuitka~=4.1.3",
    "packaging~=26.3",
    "py3amf~=0.9.1",
    "pypinyin~=0.55.0",
    "pyside6~=6.11.1",
    "requests~=2.34.2",
    "zstandard~=0.25",
]
