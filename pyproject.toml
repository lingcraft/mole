[project]
name = "mole"
version = "1.13.4"
description = """
- 新增：餐厅做菜任务启动后，正在执行做菜任务的灶台上的阳光酥油肉松修改为显示成目标菜
- 修复：餐厅做菜发包子进程处理逻辑优化，修复当子进程还存活时若子进程连接被客户端登录游戏行为挤掉后，做菜子进程会一直卡在“正在登录”状态的问题，现在重连逻辑进行了优化
"""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cffi~=2.1.1",
    "loguru~=0.7.3",
    "nuitka~=4.1.3",
    "packaging~=26.3",
    "py3amf~=0.9.1",
    "pypinyin~=0.55.0",
    "pyside6~=6.11.1",
    "requests~=2.34.2",
    "zstandard~=0.25",
]
