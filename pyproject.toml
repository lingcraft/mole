[project]
name = "mole"
version = "1.13.12"
description = """
- 优化：增加按钮、下拉框聚焦样式，上次点击的控件会紫色边框+背景修改，同时点击时聚焦的控件颜色优化，增加交互体验感
- 优化：ui_main.ui、ui_main.py 中的 style sheet 统一抽离到 style.py 中去
"""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6~=6.11.2",
    "cffi~=2.1.1",
    "nuitka~=4.2.2",
    "zstandard~=0.25",
    "packaging~=26.3",
    "py3amf~=0.9.1",
    "pypinyin~=0.55.0",
    "requests~=2.34.2",
    "loguru~=0.7.3",
]
