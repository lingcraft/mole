[project]
name = "mole"
version = "1.12.17"
description = """
- 优化：多实例注入端口和命令桥端口分配逻辑优化，当有多个实例时，端口会自动递增，原来的系统自动分配速度太慢了并且无法命中 Flash 缓存，现在多实例每个会保存自己的 swf 缓存，不会自动分配端口不固定而产生多余的可能只用1次的缓存，提升加载速度
"""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cffi~=2.1.1",
    "loguru~=0.7.3",
    "nuitka~=4.1.3",
    "packaging~=26.3",
    "py3amf~=0.9.1",
    "pypinyin~=0.55.0",
    "pyside6~=6.11.1",
    "requests~=2.34.2",
    "zstandard~=0.25",
]
