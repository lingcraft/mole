[project]
name = "mole"
version = "1.12.13"
description = """
- 优化：商店的“最新上架——潮流单品”中移除已被平行服移除的无意义可免费获得的驯兽师坐骑等商品
- 新增：元素骑士竞技场自动挑战执行时，同时增加自动领悟天赋的功能，当2者都执行完毕时才停止
- 修复：ClientAppDLL.swf 加载物品图标的功能中，修复元素骑士相关道具的图标像素错位的问题，参考平行服的源码
- 修复：ElementKnightInfoPanel.swf 元素骑士的个人信息面板中，道具数量文本在道具图标下面会被遮挡的问题修复，现在将道具数量图层置到道具图标上面
- 优化：swf/replace 目录下替换的资源增加可缓存属性，加快加载速度，但是如果已经有了旧的官服本地缓存的话，需要手动清理下缓存
- 优化：swf/append 目录下新增的xml资源优化处理逻辑，以官服xml资源为基础，加入平行服xml资源的新增内容，然后将合并后的xml再进行此目录下xml中的新增、删除数据处理
- 优化：切换到平行服时不默认切到特殊节点，现在平行服主节点已经很快了，透传使用默认 Session() 可走系统代理
- 优化：界面元素位置调整
"""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cffi~=2.1.1",
    "loguru~=0.7.3",
    "nuitka~=4.1.3",
    "packaging~=26.3",
    "py3amf~=0.9.1",
    "pypinyin~=0.55.0",
    "pyside6~=6.11.1",
    "requests~=2.34.2",
    "zstandard~=0.25",
]
