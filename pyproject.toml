[project]
name = "mole"
version = "1.11.4"
description = """
- 优化：send_lines_back() 后台线程发包函数优化，使用队列处理发送数据，防止快速循环调用时频繁启动线程以及间隔过短时部分数据被丢弃
"""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cffi~=2.1.0",
    "nuitka~=4.1.3",
    "packaging~=26.2",
    "py3amf~=0.9.1",
    "pypinyin~=0.55.0",
    "pyside6~=6.11.1",
    "requests~=2.34.2",
    "zstandard~=0.25",
]
